name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# O token do GITHUB_TOKEN so le o codigo. Sem isto ele herda a permissao
# padrao do repositorio, que pode incluir escrita: uma action comprometida
# poderia empurrar commit ou mexer em release.
permissions:
  contents: read

# Actions fixadas por SHA do commit, nao por tag. Tag pode ser movida para
# outro codigo depois (foi assim no ataque ao tj-actions/changed-files em
# 2025); SHA nao. O comentario diz a versao, e o Dependabot
# (.github/dependabot.yml) abre PR quando sai versao nova.

jobs:
  backend:
    name: Backend - build e testes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configurar JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: '21'
          distribution: temurin
          # Guarda o ~/.m2 entre execucoes: build cai de minutos para segundos.
          cache: maven

      - name: Rodar testes
        working-directory: ./backend
        run: mvn -B verify

      - name: Publicar relatorio de testes
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: relatorio-testes
          path: backend/target/surefire-reports/

  frontend:
    name: Frontend - build e lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # 24 e LTS; o Angular 22 exige ^22.22.3 ou ^24.15.0.
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        working-directory: ./frontend
        run: npm ci

      - name: Build de producao
        working-directory: ./frontend
        run: npm run build

  vulnerabilidades:
    name: Dependencias com vulnerabilidade conhecida
    runs-on: ubuntu-latest
    env:
      OSV_VERSAO: v2.6.0
      # SHA-256 do binario linux_amd64 publicado no release. Se o arquivo
      # baixado nao bater, o passo para antes de executar qualquer coisa.
      OSV_SHA256: ca69b3d3cd08f889a49dc0a383122f71cc528b83803671df5fd874d97485b108
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Binario com versao e checksum fixos, e nao a google/osv-scanner-action:
      # ela puxa a imagem Docker por tag, que pode mudar sem o SHA da action mudar.
      - name: Instalar osv-scanner
        run: |
          curl -sSfL -o osv-scanner \
            "https://github.com/google/osv-scanner/releases/download/${OSV_VERSAO}/osv-scanner_linux_amd64"
          echo "${OSV_SHA256}  osv-scanner" | sha256sum --check --strict
          chmod +x osv-scanner

      # Os dois bloqueiam. No backend entram as dependencias transitivas
      # resolvidas do pom.xml; no frontend, o package-lock.json inteiro.
      - name: Backend
        run: ./osv-scanner scan source -L backend/pom.xml

      - name: Frontend
        run: ./osv-scanner scan source -L frontend/package-lock.json

  docker:
    name: Imagens Docker
    runs-on: ubuntu-latest
    # So vale gastar tempo construindo imagem se os testes passaram.
    needs: [backend, frontend, vulnerabilidades]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build das imagens
        # O compose exige COFRE_JWT_SECRET e DB_PASSWORD ate para build. Aqui
        # so constroi imagem, nada sobe, entao valores descartaveis bastam.
        env:
          COFRE_JWT_SECRET: valor-descartavel-so-para-o-build-do-ci
          DB_PASSWORD: valor-descartavel-so-para-o-build-do-ci
        run: docker compose build
