server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Nao anuncia a versao do nginx em cabecalho e pagina de erro.
    server_tokens off;

    # Cabecalhos de seguranca. Ficam no server e nenhum location usa
    # add_header: no nginx, um add_header dentro de location descarta todos
    # os herdados daqui. "always" inclui respostas de erro (4xx/5xx).
    #
    # CSP: o token fica no localStorage, entao a defesa principal contra XSS
    # e nao executar script de fora nem inline: script-src 'self'.
    # style-src precisa de 'unsafe-inline' porque o Angular injeta o CSS dos
    # componentes em <style>; injecao de CSS e bem menos grave que de script.
    # As fontes vem do Google Fonts (CSS embutido no build, arquivos do gstatic).
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    # Impede o navegador de "adivinhar" o tipo e executar como script um
    # arquivo servido com outro Content-Type.
    add_header X-Content-Type-Options "nosniff" always;
    # Ninguem embute o Cofre em iframe (clickjacking). frame-ancestors na CSP
    # faz o mesmo; este cobre navegadores antigos.
    add_header X-Frame-Options "DENY" always;
    # Nao vaza a URL do app para sites externos.
    add_header Referrer-Policy "no-referrer" always;
    # O app nao usa camera, microfone, localizacao nem pagamento.
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    # Isola a janela de popups abertos por outros sites.
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    # HSTS fica de fora de proposito: este nginx so serve HTTP, e o navegador
    # ignora HSTS fora de HTTPS. Ao colocar TLS na frente, incluir:
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Angular e SPA: a rota /painel so existe no JavaScript. Sem este
    # try_files, dar F5 em /painel devolve 404 do nginx.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # O front chama /api/... e o nginx repassa para o container da API.
    # Assim o navegador so conhece uma origem e o CORS deixa de existir.
    location /api/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # O nginx e a borda: sobrescreve em vez de acrescentar
        # ($proxy_add_x_forwarded_for), para o cliente nao conseguir injetar
        # um IP falso e driblar o limite de tentativas da API.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        # O Spring Security tambem manda estes dois; esconde os da API para o
        # navegador nao receber o cabecalho duplicado.
        proxy_hide_header X-Frame-Options;
        proxy_hide_header X-Content-Type-Options;
    }

    gzip on;
    gzip_types text/css application/javascript application/json;
}
